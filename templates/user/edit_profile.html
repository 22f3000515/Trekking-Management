{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <!-- Heading -->

    <h2>Edit Profile</h2>

    <hr>

    <form method="POST">

        <!-- Name -->

        <div class="mb-3">

            <label class="form-label">

                Name

            </label>

            <input
                type="text"
                class="form-control"
                value="{{ user.name }}"
                readonly>

        </div>

        <!-- Email -->

        <div class="mb-3">

            <label class="form-label">

                Email

            </label>

            <input
                type="email"
                class="form-control"
                value="{{ user.email }}"
                readonly>

        </div>

        <!-- Phone -->

        <div class="mb-3">

            <label class="form-label">

                Phone Number

            </label>

            <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ user.phone or '' }}">

        </div>

        <!-- Buttons -->

        <button
            type="submit"
            class="btn btn-success">

            Update Profile

        </button>

        <a
            href="{{ url_for('user.profile') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
